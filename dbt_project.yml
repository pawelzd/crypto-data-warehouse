name: 'dbt_to_bq'
version: '1.0.0'
config-version: 2

profile: 'dbt_bq_profile'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]


clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_to_bq:
  
    feat:
      +materialized: table
      +schema: feat
    20m_feat:
      +materialized: table
      +schema: 20m_feat
    stg:
      +materialized: view
      +schema: stg
    core:
      +materialized: table
      +schema: core
    eval:
      +materialized: view
      +schema: eval
    20m_eval:
      +materialized: table
      +schema: 20m_eval
    ml:
      +materialized: table
      +schema: ml
    ema:
      +materialized: table
      +schema: ema
  
    45m_ema_feat:
      +materialized: table
      +schema: 45m_ema_feat

    strategies:
      +materialized: table
      +schema: strategies

