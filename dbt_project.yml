name: 'dbt_to_bq'
version: '1.0.0'
config-version: 2

profile: 'dbt_bq_profile'

# The RL shadow-decision service reads rl_prod_inference_features_v and needs a
# deep-enough warm-up window for the recurrent policy (episode = 216 bars), not
# the original 48h. 300h stays small/fast (members_only) while covering the
# episode. Keep this in sync with the service's lookback_bars.
vars:
  rl_prod_output_hours: 300

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]


clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_to_bq:
  
    feat:
      +materialized: table
      +schema: feat
    20m_feat:
      +materialized: table
      +schema: 20m_feat
    stg:
      +materialized: view
      +schema: stg
    stg_prices:
      +materialized: view
      +schema: stg_prices
    core:
      +materialized: table
      +schema: core
    core_prices:
      +materialized: table
      +schema: core_prices
    eval:
      +materialized: view
      +schema: eval
    20m_eval:
      +materialized: table
      +schema: 20m_eval
    rl_prod:
      +materialized: view
      +schema: rl_prod
    ml:
      +materialized: table
      +schema: ml
    ema:
      +materialized: table
      +schema: ema
  
    45m_ema_feat:
      +materialized: table
      +schema: 45m_ema_feat

    strategies:
      +materialized: table
      +schema: strategies
      
    scam_detection:
      +materialized: table
      +schema: scam_detection 

