dbt_bq_profile:
  target: adc
  outputs:
    # Application Default Credentials — NO keyfile. This is the production
    # target: on Cloud Run the attached runtime service account is used
    # automatically; locally run `gcloud auth application-default login` first.
    # Credentials are never a committed keyfile — the old SA-key JSONs were
    # scrubbed from this repo's history during the extraction from airflow-wallets.
    adc:
      type: bigquery
      method: oauth
      project: crypto-trading-474111
      dataset: raw
      threads: 4
      timeout_seconds: 300
      location: europe-central2

    # Legacy service-account target, kept for parity with the airflow-wallets
    # setup. The keyfile is NOT in this repo; supply its path via DBT_BQ_KEYFILE
    # only if you genuinely need a key (ADC is preferred everywhere, esp. Cloud Run).
    dev:
      type: bigquery
      method: service-account
      project: crypto-trading-474111
      dataset: raw
      threads: 4
      timeout_seconds: 300
      location: europe-central2
      keyfile: "{{ env_var('DBT_BQ_KEYFILE', '') }}"
