version: 2

sources:
  - name: solana_raw
    description: "Source for raw wallet and metadata extractions."
    database: positive-tuner-255507
    schema: wallets_extraction
    tables:
      - name: raw_solana_wallet_history
        description: "Raw snapshot of wallet asset holdings."
      - name: solana_mint_metadata
        description: "Raw mint metadata."
      - name: wallet_tokens
        description: "Raw wallet token holdings, test data."
      - name: tokens
        description: "Raw token metadata, test data."

  - name: solana_raw_prices
    description: "Source for token price data."
    database: positive-tuner-255507
    schema: bronze
    tables:
      - name: raw_solana_token_prices
        description: "Raw token price data, loaded daily."
      - name: raw_market_tokens_prices
        description: "Raw market token prices from CryptoDataDownload."
      - name: raw_wallet_history_features
        description: "Raw wallet history features, loaded daily."
      - name: raw_tokens_metadata
        description: "Raw token market metadata (price, liquidity, supplies, caps)."
      - name: raw_bitcoin_1min_prices
        description: "Raw Bitcoin 1-minute interval prices."

  - name: streamed_datapublic
    description: "Silver layer for cleaned and enriched data, production."
    database: positive-tuner-255507
    schema: streamed_datapublic
    tables:
      - name: historical_prices
        description: "Fact table of token prices with daily partitions, production."

  - name: silver
    description: "Silver layer for cleaned and enriched data."
    database: positive-tuner-255507
    schema: silver
    tables:
      - name: fct_token_prices
        description: "Fact table of token prices with daily partitions."
      - name: fct__token_market_metadata
        description: "Fact table of token market metadata with daily partitions."
      - name: fct__bitcoin_hourly_prices
        description: "Fact table of Bitcoin hourly prices."
      - name: dim__token_score
        description: "Dimension table of token scores and labels."

  - name: gold
    description: "Gold layer for curated data."
    database: positive-tuner-255507
    schema: gold
    tables:
      - name: unique_tokens_base
        description: "Unique tokens held across all wallets."

  - name: raw
    description: "Source for raw Birdeye data."
    database: crypto-trading-474111
    schema: raw
    tables:
      - name: raw_birdeye_ohlcv
        description: "Raw snapshot of wallet asset holdings."
      - name: raw_birdeye_market_data
        description: "Raw Birdeye market data."
  - name: raw_prices
    description: "Source for raw Birdeye OHLCV price data."
    database: crypto-trading-474111
    schema: raw_prices
    tables:
      - name: raw_birdeye_ohlcv_15m
        description: "Raw Birdeye OHLCV 15-minute data."
      - name: raw_birdeye_ohlcv_1h
        description: "Raw Birdeye OHLCV 1-hour data."
  - name: core
    description: "Source for core data."
    database: crypto-trading-474111
    schema: core
    tables:
      - name: token_metadata_jup_tmp
        description: "Token metadata from Jupiter API, temporary table."
      - name: tmp_birdeye_static_data
        description: "Temporary table for Birdeye static data with token_chain_id."
      - name: jup_tmp_v2
        description: "Token metadata from Jupiter API, version 2."

  - name: eval
    description: "Evaluation database for ml model testing and validation."
    database: crypto-trading-474111
    schema: eval
    tables:
      - name: forest_72_gain20_loss25_og_duplicate_prod_results
  
  - name: streamed_datapublic
    description: "Silver layer for cleaned and enriched data, production."
    database: crypto-trading-474111
    schema: streamed_datapublic
    tables:
      - name: public_historical_prices
        description: "Fact table of token prices with daily partitions, production."
      - name: public_tokens_to_monitor
        description: "Table of tokens to monitor with market cap and audit data." 

  - name: strategies  
    description: "crypto trading strategies database."
    database: crypto-trading-474111
    schema: strategies

  - name: ema
    description: "EMA database for technical indicator calculations."
    database: crypto-trading-474111
    schema: ema
    tables:
      - name: ema_14_50_labels
        description: "Table containing EMA 14 and 50 crossover labels."
      - name: ema_21_50_lables
        description: "Table containing EMA 21 and 50 crossover labels."
  - name: 45m_ema_feat
    description: "45-minute EMA feature database."
    database: crypto-trading-474111
    schema: 45m_ema_feat
    tables:
      - name: cv_ema21_ema50_calc
        description: "Cross-validation table for EMA 21 and 50 calculations."
      - name: cv_ema21_ema50_calc_new_method
        description: "Cross-validation table for EMA 14 and 50 calculations."

  - name: features_extra
    description: >
      Outputs of the offline daily side-pipeline (features-extra repo,
      daily_info_structure_features.py): A2 lead-lag network and Tier C
      (Levy area / volume-time momentum). Produced by an external Python job,
      not dbt; consumed by rl_inference_features_ext_v.
    database: crypto-trading-474111
    schema: features_extra
    tables:
      - name: leadlag_daily
        description: "Per run_date, each token's up-to-5 leaders with margin (A2)."
      - name: leadlag_token_scores_daily
        description: "Per run_date, per-token lead_score_90d (A2)."
      - name: tier_c_features_hourly
        description: "Hourly levy_pv_168h and mom_vt_7vd (Tier C)."

  - name: rl_prod_artifacts
    description: >
      Immutable, versioned model-contract artifacts copied from the trusted
      dip10-s1 export. These tables remove any runtime dependency on 20m_eval.
    database: crypto-trading-474111
    schema: rl_prod
    tables:
      - name: training_universe_contract_v1
        description: >
          The 423 training tokens and their exact inclusive active intervals.
          Version this artifact whenever the deployed model changes.
      - name: btc_reference_contract_v1
        description: >
          Hourly BTC log return and 24h/7d cumulative returns through the
          trusted-export cutoff. Production fails closed after its last hour.
      - name: ohlcv_revision_override_v1
        description: >
          Trusted hourly price and volume for the eight tokens whose source
          history was revised after training. Applied only where keys exist.

  - name: scam_detection_artifacts
    description: >
      Materialized scam exclusions produced independently of dbt by the
      full-history OHLCV detector.
    database: crypto-trading-474111
    schema: scam_detection
    tables:
      - name: scam_full_history_detections
        description: >
          Per-token, per-window evidence from the full-history detector. Death
          patterns are audit signals and are not consumed as lifetime filters.
      - name: scam_full_history_fixed
        description: >
          Raw one-row-per-token detector output. Kept for audit; production
          filtering uses hardened evidence from scam_full_history_detections.
