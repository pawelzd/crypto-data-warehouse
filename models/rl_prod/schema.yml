version: 2

models:
  - name: rl_prod_hourly_bars_v
    description: >
      Bounded, gap-filled hourly price/volume view read directly from production
      sources. It is the only raw-data entry point for live RL inference.
    columns:
      - name: token_address
        tests: [not_null]
      - name: price_timestamp
        tests: [not_null]

  - name: rl_prod_asset_features_v
    description: >
      Shared rolling feature calculations for monitored tokens and the BTC/SOL
      reference series. This is an internal production view.

  - name: rl_prod_hourly_bars_history_v
    description: >
      Unbounded hourly source history used only for historical feature-parity
      checks. It is intentionally excluded from the live inference graph.

  - name: rl_prod_asset_features_history_v
    description: >
      Full-history instance of the same shared rolling-feature SQL used by the
      bounded live asset-feature view.

  - name: rl_prod_universe_weekly_inputs_v2
    description: >
      Threshold-free weekly PIT measurements for the shared v2 state builder.
      Includes observed-hour continuity, trailing liquidity/size statistics,
      and scam evidence whose windows end strictly before each week boundary.
      Also exposes wash_vol_mktcap_ratio_30d + is_wash_ratio_suspect (>3x): a
      mcap/volume wash-trade signal that catches thin copycat scams the OHLCV
      scam detector misses. Evidence only — the frozen v1 universe is unaffected.

  - name: rl_prod_universe_membership_pit
    description: >
      Version-gated production membership view. It defaults to the frozen v1
      snapshot; an explicit dbt variable selects the physical v2 state only
      after a matching retrain and acceptance decision.
    columns:
      - name: token_address
        tests: [not_null]
      - name: week_start
        tests: [not_null]
      - name: in_universe_pit
        tests: [not_null]
      - name: rule_version
        tests: [not_null]
      - name: rule_config_hash
        tests: [not_null]

  - name: rl_prod_inference_features_v
    description: >
      Live dip10-s1 inference contract: exactly 100 observation features plus
      8 execution, cost, gate, and universe-selection columns.
    columns:
      - name: token_address
        tests: [not_null]
      - name: price_timestamp
        tests: [not_null]
      - name: next_open
        tests: [not_null]
      - name: next_next_open
        tests: [not_null]
      - name: dollar_amihud_24h
        tests: [not_null]
      - name: mktcap
        tests: [not_null]
      - name: dollar_vol_24h
        tests: [not_null]
      - name: in_universe_pit
        tests: [not_null]
      - name: rel_excess_vs_btc_7d
        tests: [not_null]
      - name: rel_excess_vs_btc_24h
        tests: [not_null]

  - name: rl_prod_inference_features_history_v
    description: >
      Full-history candidate/coverage relation. It retains nonmembers for
      warm-up and death context and exposes in_universe_pit for episode gating.
    columns:
      - name: rel_excess_vs_btc_7d
        tests: [not_null]
      - name: rel_excess_vs_btc_24h
        tests: [not_null]
